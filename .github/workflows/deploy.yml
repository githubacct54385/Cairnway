# Staging, then production after approval.
#
# 1. Every change to main is built once and deployed to the separate "cairnway-staging" Worker
#    (cairnway-staging.<subdomain>.workers.dev), which has its own secrets and no access to production's. The
#    built site is also saved as a workflow artifact. The "staging" job records the address as a GitHub deployment.
# 2. The "production" job waits for approval in the GitHub "production" environment. Approving it deploys the
#    SAME built files (the saved artifact, not a rebuild) to the live "cairnway" Worker.
#
# If several changes merge before you approve, GitHub queues them: the newest waits behind the
# oldest. Approving a run whose commit is no longer the newest on main does nothing (it reports
# "superseded"), so an older version can never replace a newer one. Then approve the newest run.
#
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see docs/DEPLOY.md).
name: Deploy

on:
  push:
    branches: [main]
  # Started by the automerge job in ci.yml: merges made by GitHub Actions do not trigger push
  # events, so the automerge job starts this workflow directly. Can also be started by hand.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-latest
    # No approval rule on this environment. It exists so GitHub shows a "View deployment" link.
    environment:
      name: staging
      url: ${{ steps.upload.outputs.url }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Save the built site for the production job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site
          path: dist
          retention-days: 14
          include-hidden-files: true
      - name: Deploy to the staging Worker
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          subject="$(git log -1 --format=%s | cut -c1-100)"
          npx --no-install wrangler deploy --config wrangler.staging.jsonc \
            --message "${GITHUB_SHA::7} ${subject}" | tee upload.log
          url="$(grep -oE 'https://cairnway-staging[A-Za-z0-9.-]*\.workers\.dev' upload.log | head -1 || true)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed to staging"
            echo
            echo "Commit: \`${GITHUB_SHA::7}\` ${subject}"
            echo
            if [ -n "$url" ]; then echo "Review it at $url"; else echo "See the log above for the staging address."; fi
            echo
            echo "When it looks right, approve the **production** job to make it live."
          } >> "$GITHUB_STEP_SUMMARY"

  production:
    needs: staging
    runs-on: ubuntu-latest
    # The "production" environment requires approval before this job runs.
    environment:
      name: production
      url: https://cairnway.lifetrackerappweb.workers.dev/
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check this is still the newest change on main
        id: current
        run: |
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Superseded: main is now at ${latest::7}. Nothing was deployed. Approve the newest Deploy run instead."
            echo "### Superseded, nothing deployed" >> "$GITHUB_STEP_SUMMARY"
            echo "A newer change (\`${latest::7}\`) is on main. Approve the newest Deploy run instead." >> "$GITHUB_STEP_SUMMARY"
          fi
      # Wrangler comes from the lockfile (a devDependency), not from a fresh download, so the Cloudflare token is only
      # ever used with the version this repository pins.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.current.outputs.deploy == 'true'
        with:
          node-version: 22
      - run: npm ci
        if: steps.current.outputs.deploy == 'true'
      - name: Get the site that was reviewed on staging
        if: steps.current.outputs.deploy == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: site
          path: dist
      - name: Make the reviewed site live
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --no-install wrangler deploy --message "Approved: ${GITHUB_SHA::7}"
          echo "### Live" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit \`${GITHUB_SHA::7}\` (the files reviewed on staging) is now the live site." >> "$GITHUB_STEP_SUMMARY"
