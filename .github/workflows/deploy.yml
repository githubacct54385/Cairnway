# Staging, then production after approval.
#
# 1. Every change to main is built and uploaded to Cloudflare as a new Worker version, tagged
#    with its commit. It does not go live; it appears at the staging address
#    (staging-cairnway.<subdomain>.workers.dev). The "staging" job records that address as a
#    GitHub deployment, so the run page and the repository's Deployments list link to it.
# 2. The "production" job waits for approval in the GitHub "production" environment. Approving
#    it deploys that exact uploaded version (by its version ID) to the live site. Nothing is rebuilt.
#
# If several changes merge before you approve, GitHub queues them: the newest waits behind the
# oldest. Approving a run whose commit is no longer the newest on main does nothing (it reports
# "superseded"), so an older version can never replace a newer one. Then approve the newest run.
#
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see docs/DEPLOY.md).
name: Deploy

on:
  push:
    branches: [main]
  # Started by the automerge job in ci.yml: merges made by GitHub Actions do not trigger push
  # events, so the automerge job starts this workflow directly. Can also be started by hand.
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_VERSION: 4.160.1

jobs:
  staging:
    runs-on: ubuntu-latest
    # No approval rule on this environment. It exists so GitHub shows a "View deployment" link.
    environment:
      name: staging
      url: ${{ steps.upload.outputs.url }}
    outputs:
      version_id: ${{ steps.upload.outputs.version_id }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Upload a new version to the staging address
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          subject="$(git log -1 --format=%s | cut -c1-100)"
          npx --yes "wrangler@${WRANGLER_VERSION}" versions upload \
            --tag "$GITHUB_SHA" \
            --message "$subject" \
            --preview-alias staging | tee upload.log
          url="$(grep -oE 'https://staging-[A-Za-z0-9.-]+\.workers\.dev' upload.log | head -1 || true)"
          version_id="$(grep -oE 'Worker Version ID: [0-9a-f-]+' upload.log | awk '{print $4}' | head -1 || true)"
          if [ -z "$version_id" ]; then echo "::error::Could not read the Worker Version ID from the upload output"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          {
            echo "### Uploaded to staging"
            echo
            echo "Commit: \`${GITHUB_SHA::7}\` ${subject}"
            echo
            echo "Worker version: \`${version_id}\`"
            echo
            if [ -n "$url" ]; then echo "Review it at $url"; else echo "See the log above for the staging address."; fi
            echo
            echo "When it looks right, approve the **production** job to make it live."
          } >> "$GITHUB_STEP_SUMMARY"

  production:
    needs: staging
    runs-on: ubuntu-latest
    # The "production" environment requires approval before this job runs.
    environment:
      name: production
      url: https://cairnway.lifetrackerappweb.workers.dev/
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Check this is still the newest change on main
        id: current
        run: |
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Superseded: main is now at ${latest::7}. Nothing was deployed. Approve the newest Deploy run instead."
            echo "### Superseded, nothing deployed" >> "$GITHUB_STEP_SUMMARY"
            echo "A newer change (\`${latest::7}\`) is on main. Approve the newest Deploy run instead." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Make the reviewed version live
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ needs.staging.outputs.version_id }}
        run: |
          npx --yes "wrangler@${WRANGLER_VERSION}" versions deploy \
            "${VERSION_ID}@100" \
            --message "Approved: ${GITHUB_SHA::7}" \
            --yes
          echo "### Live" >> "$GITHUB_STEP_SUMMARY"
          echo "Version \`${VERSION_ID}\` (commit \`${GITHUB_SHA::7}\`) is now the live site." >> "$GITHUB_STEP_SUMMARY"
